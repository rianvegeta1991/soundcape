<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2a4f"/>
      <stop offset="1" stop-color="#070c17"/>
    </linearGradient>
    <linearGradient id="schild" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#80bcff"/>
      <stop offset="1" stop-color="#9278ec"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Schild: waagerecht 104..408, senkrecht 78..438 -->
  <path d="M256 78
           C200 96 148 104 104 104
           C104 170 108 250 130 312
           C158 380 204 416 256 438
           C308 416 354 380 382 312
           C404 250 408 170 408 104
           C364 104 312 96 256 78 Z"
        fill="url(#schild)"/>

  <!-- Klangwelle, mittig im Schild.
       Vorher lagen die Ausschläge links und rechts lief ein langer flacher
       Strich aus – das zog das Motiv sichtbar nach links, obwohl es rechnerisch
       zentriert war. Jetzt ist die Kurve spiegelsymmetrisch um x=256: gleich
       lange Ausläufer, der höchste Ausschlag genau in der Mitte.
       Waagerecht 146..366 (Mitte 256), senkrecht 198..330 (Mitte 264).
       Die Mitte liegt bewusst 6 unter der geometrischen Schildmitte: das
       Schild laeuft nach unten spitz zu, bei Mitte 252 stand die Welle
       sichtbar zu hoch. -->
  <path d="M146 280
           h20 l16 -30 l16 54 l16 -74 l18 100
           l24 -132 l24 132 l18 -100
           l16 74 l16 -54 l16 30 h20"
        fill="none" stroke="#0c1424" stroke-width="23"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
